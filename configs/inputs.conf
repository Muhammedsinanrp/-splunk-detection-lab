# ==============================================================================
# Splunk Universal Forwarder — inputs.conf
# Deployment Target: %SPLUNK_HOME%\etc\system\local\inputs.conf (Windows Endpoint)
# Purpose: High-fidelity endpoint telemetry collection for SOC Detection Lab
# ==============================================================================

# --- Windows Security Event Logs ---
[WinEventLog://Security]
disabled = 0
index = wineventlog
sourcetype = WinEventLog:Security
# Ingest critical audit categories: Logon/Logoff, Privilege Use, Process Creation, Account Management
whitelist = 4624,4625,4672,4688,4698,4720,4728,4732,4738,4740,7045
renderXml = 1
checkpointInterval = 5

# --- Windows System Event Logs ---
[WinEventLog://System]
disabled = 0
index = wineventlog
sourcetype = WinEventLog:System
whitelist = 7045,7036,104,1102
renderXml = 1
checkpointInterval = 5

# --- Microsoft Sysmon Operational Telemetry ---
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = sysmon
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
# Events captured:
# 1: Process Creation | 3: Network Connection | 7: Image Loaded | 8: CreateRemoteThread
# 10: ProcessAccess (LSASS) | 11: FileCreate | 12/13/14: Registry Events | 22: DNS Query
renderXml = 1
checkpointInterval = 5

# --- PowerShell Operational Logs (Script Block & Pipeline Execution) ---
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog
sourcetype = WinEventLog:Microsoft-Windows-PowerShell/Operational
whitelist = 4103,4104
renderXml = 1
checkpointInterval = 5
