# ==============================================================================
# Splunk Enterprise — props.conf
# Deployment Target: $SPLUNK_HOME/etc/apps/soc_detection_app/local/props.conf
# Purpose: Sourcetype parsing, field aliasing for CIM compliance, and lookups
# ==============================================================================

[WinEventLog:Security]
LOOKUP-user_privilege = user_privilege_lookup Account_Name OUTPUT Department, Privilege_Level, Expected_Logon_Type, Notes
FIELDALIAS-src_ip = IpAddress AS src_ip
FIELDALIAS-dest_user = TargetUserName AS user
FIELDALIAS-src_user = SubjectUserName AS src_user
FIELDALIAS-dest_host = ComputerName AS dest
EVAL-action = if(EventCode==4624, "success", if(EventCode==4625, "failure", "unknown"))

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
FIELDALIAS-process_name = Image AS process_name
FIELDALIAS-parent_process = ParentImage AS parent_process
FIELDALIAS-cmdline = CommandLine AS process
FIELDALIAS-dest_ip = DestinationIp AS dest_ip
FIELDALIAS-dest_port = DestinationPort AS dest_port
FIELDALIAS-src_ip = SourceIp AS src_ip
FIELDALIAS-target_image = TargetImage AS target_image
FIELDALIAS-granted_access = GrantedAccess AS granted_access
EVAL-vendor_product = "Microsoft Sysmon"
