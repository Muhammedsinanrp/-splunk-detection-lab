# ==============================================================================
# Splunk Enterprise — indexes.conf
# Deployment Target: $SPLUNK_HOME/etc/apps/soc_detection_app/local/indexes.conf
# Purpose: Define custom indexes for Windows Event Logs, Sysmon, and Alerts
# ==============================================================================

[wineventlog]
homePath   = $SPLUNK_DB/wineventlog/db
coldPath   = $SPLUNK_DB/wineventlog/colddb
thawedPath = $SPLUNK_DB/wineventlog/thaweddb
maxTotalDataSizeMB = 10000
maxWarmDBCount = 300
frozenTimePeriodInSecs = 7776000
datatype = event

[sysmon]
homePath   = $SPLUNK_DB/sysmon/db
coldPath   = $SPLUNK_DB/sysmon/colddb
thawedPath = $SPLUNK_DB/sysmon/thaweddb
maxTotalDataSizeMB = 10000
maxWarmDBCount = 300
frozenTimePeriodInSecs = 7776000
datatype = event

[alerts]
homePath   = $SPLUNK_DB/alerts/db
coldPath   = $SPLUNK_DB/alerts/colddb
thawedPath = $SPLUNK_DB/alerts/thaweddb
maxTotalDataSizeMB = 5000
frozenTimePeriodInSecs = 15552000
datatype = event
