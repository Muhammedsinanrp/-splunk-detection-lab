# ==============================================================================
# Splunk Enterprise — savedsearches.conf
# Deployment Target: $SPLUNK_HOME/etc/apps/soc_detection_app/local/savedsearches.conf
# Purpose: Define automated correlation rules, alert actions, and schedules
# ==============================================================================

[default]
disabled = 0

[SOC - Lateral Movement Detected]
search = index=wineventlog (sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) (EventCode=4625 OR EventCode=4624) Logon_Type IN (3, 10) \
| transaction Account_Name maxspan=10m \
| where mvcount(EventCode) > 1 AND mvcount(ComputerName) > 1 \
| search EventCode=4625 AND EventCode=4624 \
| table _time, Account_Name, ComputerName, IpAddress, EventCode, Logon_Type
cron_schedule = */5 * * * *
description = Detects failed authentication followed quickly by successful authentication on a different host within 10 minutes (T1021 Remote Services / Lateral Movement).
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = Account_Name
alert.suppress.period = 1h
action.email = 1
action.email.to = soc-alerts@company.local
action.email.subject = [HIGH ALERT] Potential Lateral Movement: $result.Account_Name$

[SOC - Privilege Escalation - Unauthorized Admin Privilege]
search = index=wineventlog (sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4672 NOT Account_Name IN ("SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE", "ANONYMOUS LOGON", "*$") \
| lookup user_privilege_lookup Account_Name OUTPUT Department, Privilege_Level \
| where Privilege_Level != "DomainAdmin" AND Privilege_Level != "LocalAdmin" \
| table _time, Account_Name, ComputerName, PrivilegeList, Privilege_Level, Department
cron_schedule = */5 * * * *
description = Detects special privileges assigned (Event 4672) to non-administrative / standard user accounts (T1078 Valid Accounts / Privilege Escalation).
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = Account_Name
alert.suppress.period = 30m
action.email = 1
action.email.to = soc-tier2@company.local
action.email.subject = [CRITICAL ALERT] Privilege Escalation Detected: $result.Account_Name$

[SOC - Brute Force Password Spraying Detected]
search = index=wineventlog (sourcetype=WinEventLog:Security OR sourcetype=XmlWinEventLog:Security) EventCode=4625 \
| bin _time span=5m \
| stats count as failed_attempts, dc(Account_Name) as distinct_users, values(Account_Name) as targeted_users by _time, IpAddress, ComputerName \
| where failed_attempts >= 5 OR distinct_users >= 3 \
| table _time, IpAddress, ComputerName, failed_attempts, distinct_users, targeted_users
cron_schedule = */5 * * * *
description = Detects high volume of failed logon attempts (Event 4625) from a single IP address within 5 minutes (T1110 Brute Force / Password Spraying).
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.suppress = 1
alert.suppress.fields = IpAddress
alert.suppress.period = 15m
action.email = 1
action.email.to = soc-tier1@company.local
action.email.subject = [MEDIUM ALERT] Brute Force / Password Spray from $result.IpAddress$

[SOC - Credential Dumping - LSASS Process Access]
search = index=sysmon (sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational) EventCode=10 \
| where like(lower(TargetImage), "%\\lsass.exe") AND NOT like(lower(SourceImage), "%\\system32\\csrss.exe") AND NOT like(lower(SourceImage), "%\\system32\\services.exe") AND NOT like(lower(SourceImage), "%\\system32\\lsass.exe") \
| table _time, SourceImage, TargetImage, GrantedAccess, CallTrace, SourceUser, Computer
cron_schedule = */5 * * * *
description = Detects suspicious processes accessing LSASS memory for credential extraction like Mimikatz or procdump (T1003.001 OS Credential Dumping).
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
action.email = 1
action.email.to = soc-tier2@company.local
action.email.subject = [CRITICAL ALERT] LSASS Credential Dumping: $result.SourceImage$

[SOC - C2 Network Beaconing Activity]
search = index=sysmon (sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational OR sourcetype=WinEventLog:Microsoft-Windows-Sysmon/Operational) EventCode=3 \
| where NOT cidrmatch("10.0.0.0/8", DestinationIp) AND NOT cidrmatch("172.16.0.0/12", DestinationIp) AND NOT cidrmatch("192.168.0.0/16", DestinationIp) \
| stats count, earliest(_time) as first_seen, latest(_time) as last_seen, values(DestinationPort) as dst_ports by Image, DestinationIp, Computer \
| eval duration_sec = last_seen - first_seen \
| where count >= 10 AND duration_sec <= 300 \
| eval conn_rate = round(count / (duration_sec / 60), 2) \
| table Computer, Image, DestinationIp, dst_ports, count, duration_sec, conn_rate
cron_schedule = */10 * * * *
description = Detects rapid, periodic outbound network connections to non-RFC1918 public IP addresses indicating active Command and Control beaconing (T1071 Application Layer Protocol).
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
