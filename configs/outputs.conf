# Splunk Universal Forwarder — outputs.conf
# Place in: %SPLUNK_HOME%\etc\system\local\outputs.conf (Windows target)
# Replace 192.168.x.x with your Splunk Enterprise indexer IP.

[tcpout]
defaultGroup = splunk_indexer

[tcpout:splunk_indexer]
server = 192.168.x.x:9997

[tcpout-server://192.168.x.x:9997]
