# ==============================================================================
# Splunk Universal Forwarder — outputs.conf
# Deployment Target: %SPLUNK_HOME%\etc\system\local\outputs.conf (Windows Endpoint)
# Purpose: Forward telemetry to Splunk Enterprise Indexer on port 9997 (TCP/TLS)
# ==============================================================================

[tcpout]
defaultGroup = splunk_soc_indexer
maxQueueSize = 50MB
compressed = false

[tcpout:splunk_soc_indexer]
# Replace 192.168.1.50 with your Splunk Indexer / Docker host IP
server = 192.168.1.50:9997
sendCookedData = true
heartbeatFrequency = 30
useACK = true
blockOnCloning = true
autoLB = true
